name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - recovery-r1-canonical-schema

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: https://example.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  p2-database-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: p2_visibility_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p2_visibility_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: p2_visibility_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Bootstrap isolated test schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p2_ci_schema.sql

      - name: Apply proposed visibility migration to disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012230000_p2_public_promos_require_active_store.sql

      - name: Assert anonymous visibility and click / vote behaviour
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p2_disabled_store_visibility.sql
